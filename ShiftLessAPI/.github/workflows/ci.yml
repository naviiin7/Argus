Ci · YML
name: API CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
permissions:
  contents: read
  packages: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
 
      - name: Restore
        run: dotnet restore ShiftLess.slnx
 
      - name: Build
        run: dotnet build ShiftLess.slnx -c Release --no-restore
 
      # Add `dotnet test` here once you have a test project.
 
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
 
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      # Uses the Dockerfile at the repo root (the one Render builds).
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shiftless-api:latest
            ghcr.io/${{ github.repository_owner }}/shiftless-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Only needed if you turn Render's auto-deploy OFF (recommended, so
      # Render doesn't deploy before CI passes). Add RENDER_DEPLOY_HOOK_URL
      # in GitHub: Settings > Secrets and variables > Actions.
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
 
